<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisy Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-box {
      width: 400px;
      height: 600px;
      background: white;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #d1f1ff;
    }

    .bot {
      align-self: flex-start;
      background: #e2e2e2;
    }

    .sys {
      align-self: center;
      font-size: 12px;
      color: #888;
    }

    form {
      display: flex;
      border-top: 1px solid #ddd;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 0 0 0 12px;
    }

    button {
      border: none;
      background: #007bff;
      color: white;
      padding: 10px 15px;
      border-radius: 0 0 12px 0;
      cursor: pointer;
    }

    #clearChat {
      background: #ff4757;
      border-radius: 8px;
      margin: 8px;
      padding: 6px 10px;
      color: white;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <div id="chatContainer"></div>
    <form id="chatForm">
      <input id="chatInput" type="text" placeholder="Schreib an Wisy..." />
      <button type="submit">Senden</button>
    </form>
    <button id="clearChat">Verlauf löschen</button>
  </div>

  <!-- Script laden -->
  <script src="/js/wisy.js" defer></script>
</body>
</html>
